# servo_config.yaml
# Configuration for moveit_servo's servo_node, tuned for FR3 spacemouse jogging.

/**:
  ros__parameters:
    moveit_servo:
      use_gazebo: false

      # ---- Frames -----------------------------------------------------------
      planning_frame: fr3_link0
      ee_frame_name: fr3_hand_tcp
      robot_link_command_frame: fr3_hand_tcp   # frame the incoming Twist is expressed in

      # ---- Command input ------------------------------------------------------
      command_in_type: "unitless"              # spacemouse gives [-1,1]-ish values, not m/s
      cartesian_command_in_topic: ~/delta_twist_cmds   # -> /servo_node/delta_twist_cmds
      joint_command_in_topic: ~/delta_joint_cmds
      command_out_topic: /fr3_arm_controller/joint_trajectory
      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false

      # ---- Rates / smoothing --------------------------------------------------
      publish_period: 0.02          # 50 Hz output
      low_pass_filter_coeff: 2.0    # higher = more smoothing, more lag

      # ---- Scaling (unitless mode: incoming value * this = actual m/s or rad/s) ---
      scale:
        linear: 0.25
        rotational: 0.50

      # ---- Safety -------------------------------------------------------------
      move_group_name: fr3_arm
      joint_topic: /joint_states
      incoming_command_timeout: 0.2   # stop if no new command within this time
      num_outgoing_halt_msgs_to_publish: 4

      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margin: 0.1

      check_collisions: true
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02